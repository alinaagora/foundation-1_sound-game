<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Mystery Card Show — Agora Kids</title>
<style>
  :root{
    --orange:#ff7a21;
    --brown:#4e3726;
    --cream:#f5f0e8;
    --card:#f4f4f4;
    --ink:#1f1f1f;
    --gold:#f4c53c;
    --deep:#1a0f22;
    --mid:#2c1a3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Trebuchet MS','Segoe UI',sans-serif;
    min-height:100vh; overflow-x:hidden; position:relative; color:#fff;
    background: radial-gradient(120% 100% at 50% 0%, var(--mid) 0%, var(--deep) 60%, #0d0714 100%);
  }

  /* ---- curious backdrop: drifting sparkles + soft spotlight beams ---- */
  .stage-bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .beam{
    position:absolute; top:-10%; width:140px; height:140%;
    background:linear-gradient(180deg, rgba(255,255,255,.05), transparent 70%);
    transform:rotate(8deg);
  }
  .spark{
    position:absolute; border-radius:50%; background:var(--gold);
    box-shadow:0 0 8px 2px rgba(244,197,60,.7);
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:1; transform:scale(1.2);} }
  .ring-orb{
    position:absolute; border-radius:50%; border:2px solid rgba(255,122,33,.18);
    animation: ringPulse 5s ease-in-out infinite;
  }
  @keyframes ringPulse{ 0%,100%{ transform:scale(1); opacity:.5;} 50%{ transform:scale(1.15); opacity:.15;} }

  .icon-btn{
    position:fixed; top:14px; z-index:5; background:rgba(0,0,0,.4); border:2px solid rgba(255,255,255,.3);
    color:#fff; width:42px; height:42px; border-radius:50%; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);
  }
  #muteBtn{ right:14px; }
  #restartBtn{ left:14px; }

  header{ position:relative; z-index:2; text-align:center; padding:20px 14px 4px; }
  .brand-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; letter-spacing:2px; color:var(--orange); font-weight:700; text-transform:uppercase;
    opacity:.9; margin-bottom:6px;
  }
  .puzzle-mark{ width:16px; height:16px; border:2.5px solid var(--orange); border-radius:50%; display:inline-block; }
  h1{
    font-size:clamp(24px,5.5vw,42px); margin:0; color:#fff;
    text-shadow: 0 0 22px rgba(244,197,60,.55), 0 3px 0 rgba(0,0,0,.4); letter-spacing:1px;
  }
  .subtitle{ color:#e8d9e9; opacity:.85; margin-top:6px; font-size:clamp(13px,2.3vw,16px); }

  main{ position:relative; z-index:2; max-width:1040px; margin:0 auto; padding:18px 16px 60px; }

  .grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:16px; max-width:960px; margin:10px auto 0;
  }
  @media (max-width:760px){ .grid{ grid-template-columns:repeat(3,1fr); gap:12px; } }
  @media (max-width:460px){ .grid{ grid-template-columns:repeat(2,1fr); gap:10px; } }

  .card-slot{ perspective:1200px; aspect-ratio:3/4; }
  .card{
    position:relative; width:100%; height:100%; cursor:pointer;
    transform-style:preserve-3d; transition: transform .7s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); cursor:default; }
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .card-back{
    background:
      radial-gradient(circle at 30% 25%, rgba(244,197,60,.25), transparent 55%),
      radial-gradient(circle at 70% 75%, rgba(255,122,33,.22), transparent 55%),
      linear-gradient(155deg, #2c1a3a 0%, #1a0f22 100%);
    border:3px solid var(--gold);
    position:relative; overflow:hidden;
  }
  .card-back::before{
    content:"✨"; font-size:clamp(24px,6vw,40px); opacity:.85;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .card-back .swirl{
    position:absolute; inset:0; border-radius:50%; opacity:.12;
    background: conic-gradient(from 0deg, var(--gold), var(--orange), transparent, var(--gold));
    animation: swirlSpin 8s linear infinite;
  }
  @keyframes swirlSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .card-front{
    background:#fff; transform:rotateY(180deg); padding:10px 8px 10px; border:3px solid var(--gold);
  }
  .card-front img{ width:78%; max-height:64%; object-fit:contain; filter:drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .card-front .word{
    margin-top:6px; font-weight:800; color:var(--brown); font-size:clamp(12px,2.4vw,16px);
    text-transform:lowercase; letter-spacing:.5px;
  }
  .card-front .word .hl{ color:var(--orange); text-transform:uppercase; }

  footer{ position:relative; z-index:2; text-align:center; color:rgba(255,255,255,.35); font-size:11px; padding:6px 0 20px; }

  .hint{ text-align:center; color:#e8d9e9; opacity:.7; font-size:13px; margin-top:16px; }
  .fingers{ text-align:center; margin-top:6px; font-size:13px; color:var(--gold); opacity:.9; }
</style>
</head>
<body>

<div class="stage-bg" id="stageBg"></div>

<button class="icon-btn" id="muteBtn" title="Mute / unmute">🔊</button>
<button class="icon-btn" id="restartBtn" title="Flip all back">↺</button>

<header>
  <div class="brand-row"><span class="puzzle-mark"></span> AGORA KIDS · FOUNDATION · LESSON 3</div>
  <h1>The Mystery Card Show</h1>
  <div class="subtitle">Tap a card. Reveal the word. Which sound do you hear?</div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="hint">🔊 Turn the sound on for the show fanfare!</div>
  <div class="fingers">☝️ 1 finger = T &nbsp;&nbsp;·&nbsp;&nbsp; ✌️ 2 fingers = I &nbsp;&nbsp;·&nbsp;&nbsp; ✋ neither? Don't raise a finger!</div>
</main>

<footer>Made for Agora Kids</footer>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function wordMarkup(word){
  const first = word[0].toUpperCase();
  return `<span class="hl">${first}</span>${word.slice(1)}`;
}

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  shuffle(CARDS).forEach(item=>{
    const slot = document.createElement('div');
    slot.className='card-slot';
    slot.innerHTML = `
      <div class="card" data-id="${item.id}">
        <div class="card-face card-back"><div class="swirl"></div></div>
        <div class="card-face card-front">
          <img src="${item.img}" alt="${item.word}">
          <div class="word">${wordMarkup(item.word)}</div>
        </div>
      </div>`;
    const cardEl = slot.querySelector('.card');
    cardEl.addEventListener('click', ()=>flipCard(cardEl));
    grid.appendChild(slot);
  });
}
buildGrid();

/* ---- audio: synth "show" fanfare + flip whoosh, no files ---- */
let audioCtx=null, muted=false;
function ac(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(freq, dur, type='sine', vol=.18, delay=0){
  if(muted) return;
  const ctx=ac(); const t0=ctx.currentTime+delay;
  const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+.02);
  gain.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+.05);
}
function playFlip(){
  if(muted) return;
  const ctx=ac(); const t0=ctx.currentTime;
  const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(200,t0);
  osc.frequency.exponentialRampToValueAtTime(700,t0+.18);
  gain.gain.setValueAtTime(.001,t0);
  gain.gain.linearRampToValueAtTime(.1,t0+.03);
  gain.gain.exponentialRampToValueAtTime(.001,t0+.2);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+.22);
}
function playFanfare(){
  [523,659,784,1046].forEach((f,i)=>tone(f,.32,'triangle',.16,i*.09));
  tone(1046,.5,'sine',.12,.4);
}
let ambientNodes=[];
function startAmbient(){
  if(muted) return;
  stopAmbient();
  const ctx=ac();
  [98,147].forEach((f,i)=>{
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='sine'; osc.frequency.value=f;
    gain.gain.value=0;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.linearRampToValueAtTime(.018, ctx.currentTime+2);
    ambientNodes.push({osc,gain});
  });
}
function stopAmbient(){
  ambientNodes.forEach(n=>{ try{ n.gain.gain.linearRampToValueAtTime(0, ac().currentTime+.4); n.osc.stop(ac().currentTime+.5);}catch(e){} });
  ambientNodes=[];
}

let started=false;
function ensureStarted(){
  if(!started){ started=true; ac(); startAmbient(); }
}

function flipCard(cardEl){
  ensureStarted();
  if(cardEl.classList.contains('flipped')) return;
  cardEl.classList.add('flipped');
  playFlip();
  setTimeout(playFanfare, 380);
}

/* backdrop decoration */
function buildDecor(){
  const bg = document.getElementById('stageBg');
  for(let i=0;i<5;i++){
    const b=document.createElement('div');
    b.className='beam';
    b.style.left=(10+i*20)+'vw';
    bg.appendChild(b);
  }
  for(let i=0;i<28;i++){
    const s=document.createElement('div');
    s.className='spark';
    const size=2+Math.random()*3;
    s.style.width=size+'px'; s.style.height=size+'px';
    s.style.left=(Math.random()*100)+'vw';
    s.style.top=(Math.random()*100)+'vh';
    s.style.animationDelay=(Math.random()*2.4)+'s';
    bg.appendChild(s);
  }
  for(let i=0;i<4;i++){
    const r=document.createElement('div');
    r.className='ring-orb';
    const size=200+Math.random()*260;
    r.style.width=r.style.height=size+'px';
    r.style.left=(Math.random()*90)+'vw';
    r.style.top=(Math.random()*90)+'vh';
    r.style.animationDelay=(Math.random()*3)+'s';
    bg.appendChild(r);
  }
}
buildDecor();

document.getElementById('restartBtn').addEventListener('click', ()=>{
  buildGrid();
});
document.getElementById('muteBtn').addEventListener('click', (e)=>{
  muted = !muted;
  e.target.textContent = muted ? '🔇' : '🔊';
  if(muted) stopAmbient(); else if(started) startAmbient();
});
</script>
